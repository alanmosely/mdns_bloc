    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "monthly"

  - package-ecosystem: "gradle"
    directory: "/example/android"
    schedule:
      interval: "monthly"
