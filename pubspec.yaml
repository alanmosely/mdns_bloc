name: mdns_bloc
description: Bloc wrapper over 'multicast_dns' which performs service discovery over multicast DNS (mDNS), Bonjour and Avahi.
version: 0.3.1
repository: https://github.com/alanmosely/mdns_bloc
issue_tracker: https://github.com/alanmosely/mdns_bloc/issues
topics:
  - mdns
  - bonjour
  - avahi
  - bloc
  - service-discovery

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ">=2.0.5 <4.0.0"
  meta: ^1.15.0
  multicast_dns: ^0.3.3

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  mocktail: ^1.0.0
  test: ^1.25.0
