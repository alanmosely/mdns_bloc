name: mdns_bloc_example
description: Demonstrates how to use the mdns_bloc library.

# This example app is bundled with the mdns_bloc package and is not meant to
# be published.
publish_to: "none"

environment:
  sdk: ^3.5.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  mdns_bloc:
    # When depending on this package from a real application you should use:
    #   mdns_bloc: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the package so we use a path dependency
    # on the parent directory to use the current version.
    path: ../

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  # The widget test fakes the mDNS client with raw resource records.
  multicast_dns: ^0.3.3

flutter:
  uses-material-design: true
